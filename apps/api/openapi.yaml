openapi: 3.0.3
info:
  title: AgroAgent API
  version: 0.3.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Health check
  /v1/auth/register:
    post:
      summary: Register user and return JWT token
  /v1/auth/login:
    post:
      summary: Login and return JWT token
  /v1/auth/me:
    get:
      summary: Current user profile
  /v1/chat/sessions:
    post:
      summary: Create chat session
  /v1/chat/messages:
    post:
      summary: Send message to agent pipeline
  /v1/documents:
    post:
      summary: Upload knowledge document (async ingestion job)
  /v1/documents/{id}:
    get:
      summary: Get document status
  /v1/rag/query:
    post:
      summary: Retrieve relevant chunks and generate grounded answer
  /v1/rag/compare:
    post:
      summary: A/B compare retrieval profiles for same query
  /v1/agents/debate:
    post:
      summary: Run dynamic hierarchical agents with multi-round debate and return verifiable trace digest
  /v1/agents/traces/{trace_id}:
    get:
      summary: Read stored debate trace steps by trace ID
  /v1/agents/metrics:
    get:
      summary: Read aggregate debate metrics (runs, winner split, latency, average rounds/steps)
  /v1/agents/safety/audit:
    get:
      summary: List safety audit records (policy version, rules, override info)
  /v1/agents/safety/evals/run:
    post:
      summary: Run multilingual safety benchmark and optionally persist metrics to eval_runs
  /metrics:
    get:
      summary: Prometheus metrics endpoint for debate/safety counters
  /v1/tools/weather:
    post:
      summary: Weather tool
  /v1/tools/ndvi:
    post:
      summary: NDVI proxy from RGB image
  /v1/evals/run:
    post:
      summary: Queue evaluation run
  /v1/evals:
    get:
      summary: List evaluation runs (filter by dataset/model)
  /v1/evals/{run_id}:
    get:
      summary: Get evaluation run details
  /v1/jobs:
    get:
      summary: List background jobs
  /v1/jobs/{job_id}:
    get:
      summary: Get background job status
